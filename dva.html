<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }

    body {
      background-color: #faf8ef;
      color: #776e65;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 450px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: #bbada0;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-align: center;
      min-width: 65px;
    }

    .score-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #eee4da;
      font-weight: bold;
    }

    .score-value {
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 14px;
    }

    .btn {
      background: #8f7a66;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #9f8a76;
    }

    /* CSS Grid Board */
    .grid-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #bbada0;
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
    }

    .tile {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      transition: all 0.1s ease-in-out;
    }

    /* Tile Styles */
    .tile-2 { background: #eee4da; color: #776e65; }
    .tile-4 { background: #ede0c8; color: #776e65; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }

    .instructions {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="subtitle">Join numbers to reach <strong>2048!</strong></div>
      <div>
