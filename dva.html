<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Game</title>
  <style>
    :root {
      --bg-color: #faf8ef;
      --grid-bg: #bbada0;
      --cell-bg: rgba(238, 228, 218, 0.35);
      --text-dark: #776e65;
      --text-light: #f9f6f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      line-height: 1;
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: var(--grid-bg);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-align: center;
      min-width: 70px;
    }

    .score-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #eee4da;
      font-weight: bold;
    }

    .score-value {
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-dark);
    }

    .btn {
      background: #8f7a66;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #9f8a76;
    }

    .game-board {
      position: relative;
      width: 100%;
      padding-top: 100%; /* Square Aspect Ratio */
      background: var(--grid-bg);
      border-radius: 8px;
      padding: 12px;
    }

    .grid-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
    }

    .grid-cell {
      background: var(--cell-bg);
      border-radius: 4px;
    }

    .tile-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
    }

    .tile {
      position: absolute;
      width: calc((100% - 36px) / 4);
      height: calc((100% - 36px) / 4);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      transition: transform 100ms ease-in-out;
      animation: appear 150ms ease-in-out;
    }

    @keyframes appear {
      0% { opacity: 0; transform: scale(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    .tile-pop {
      animation: pop 150ms ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Tile Dynamic Colors */
    .tile-2 { background: #eee4da; color: #776e65; }
    .tile-4 { background: #ede0c8; color: #776e65; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }
    .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 18px; }

    .instructions {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #776e65;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="subtitle">Join numbers to reach <strong>2048!</strong></div>
      <div>
        <button class="btn" id="undo-btn">Undo</button>
        <button class="btn" id="restart-btn">New Game</button>
      </div>
    </div>

    <div class="game-board">
      <div class="grid-container">
        <!-- 16 static grid cells -->
        <script>
          for (let i = 0; i < 16; i++) {
            document.write('<div class="grid-cell"></div>');
          }
        </script>
      </div>
      <div class="tile-container" id="tile-container"></div>
    </div>

    <div class="instructions">
      <strong>HOW TO PLAY:</strong> Use <strong>Arrow keys, WASD</strong>, or <strong>Swipe</strong> to move tiles. Equal tiles merge when they collide!
    </div>
  </div>

  <script>
    class Game2048 {
      constructor() {
        this.size = 4;
        this.board = Array(4).fill(null).map(() => Array(4).fill(0));
        this.score = 0;
        this.best = parseInt(localStorage.getItem('2048_best')) || 0;
        this.history = [];
        
        this.tileContainer = document.getElementById('tile-container');
        this.scoreEl = document.getElementById('score');
        this.bestEl = document.getElementById('best');
        
        this.initSound();
        this.initControls();
        this.restart();
      }

      initSound() {
        this.audioCtx = null;
      }

      playSound(freq = 440, type = 'sine') {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.1);
      }

      saveState() {
        this.history.push({
          board: JSON.parse(JSON.stringify(this.board)),
          score: this.score
        });
        if (this.history.length > 5) this.history.shift();
      }

      undo() {
        if (this.history.length === 0) return;
        const lastState = this.history.pop();
        this.board = lastState.board;
        this.score = lastState.score;
        this.updateDisplay();
      }

      restart() {
        this.board = Array(4).fill(null).map(() => Array(4).fill(0));
        this.score = 0;
        this.history = [];
        this.addTile();
        this.addTile();
        this.updateDisplay();
      }

      addTile() {
        let empty = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (this.board[r][c] === 0) empty.push({ r, c });
          }
        }
        if (empty.length > 0) {
          let { r, c } = empty[Math.floor(Math.random() * empty.length)];
          this.board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
      }

      move(dir) {
        this.saveState();
        let moved = false;
        let scoreGained = 0;

        const rotate = (matrix) => matrix[0].map((_, colIndex) => matrix.map(row => row[colIndex]).reverse());
        
        let rotCount = 0;
        if (dir === 'left') rotCount = 0;
        if (dir === 'down') rotCount = 1;
        if (dir === 'right') rotCount = 2;
        if (dir === 'up') rotCount = 3;

        let tempBoard = JSON.parse(JSON.stringify(this.board));
        for (let i = 0; i < rotCount; i++) tempBoard = rotate(tempBoard);

        for (let r = 0; r < 4; r++) {
          let row = tempBoard[r].filter(val => val !== 0);
          for (let c = 0; c < row.length - 1; c++) {
            if (row[c] === row[c + 1]) {
              row[c] *= 2;
              scoreGained += row[c];
              row.splice(c + 1, 1);
              moved = true;
            }
          }
          while (row.length < 4) row.push(0);
          if (JSON.stringify(tempBoard[r]) !== JSON.stringify(row)) moved = true;
          tempBoard[r] = row;
        }

        for (let i = 0; i < (4 - rotCount) % 4; i++) tempBoard = rotate(tempBoard);

        if (moved) {
          this.board = tempBoard;
          this.score += scoreGained;
          if (this.score > this.best) {
            this.best = this.score;
            localStorage.setItem('2048_best', this.best);
          }
          this.addTile();
          this.updateDisplay();
          this.playSound(scoreGained > 0 ? 587.33 : 300);
        } else {
          this.history.pop();
        }
      }

      updateDisplay() {
        this.scoreEl.innerText = this.score;
        this.bestEl.innerText = this.best;
        this.tileContainer.innerHTML = '';

        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            let val = this.board[r][c];
            if (val > 0) {
              let tile = document.createElement('div');
              let classVal = val <= 2048 ? val : 'super';
              tile.className = `tile tile-${classVal}`;
              tile.innerText = val;
              
              // Calculate positioning based on relative grid percent
              let top = r * 25;
              let left = c * 25;
              tile.style.transform = `translate(${left * 3.7}px, ${top * 3.7}px)`;
              
              // CSS percentage based translation
              tile.style.left = `calc(${c * 25}% + ${c * 3}px)`;
              tile.style.top = `calc(${r * 25}% + ${r * 3}px)`;

              this.tileContainer.appendChild(tile);
            }
          }
        }
      }

      initControls() {
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a') this.move('left');
          if (e.key === 'ArrowRight' || e.key === 'd') this.move('right');
          if (e.key === 'ArrowUp' || e.key === 'w') this.move('up');
          if (e.key === 'ArrowDown' || e.key === 's') this.move('down');
        });

        let startX, startY;
        document.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
          if (!startX || !startY) return;
          let diffX = e.changedTouches[0].clientX - startX;
          let diffY = e.changedTouches[0].clientY - startY;

          if (Math.abs(diffX) > Math.abs(diffY)) {
            if (Math.abs(diffX) > 30) this.move(diffX > 0 ? 'right' : 'left');
          } else {
            if (Math.abs(diffY) > 30) this.move(diffY > 0 ? 'down' : 'up');
          }
          startX = null;
          startY = null;
        });

        document.getElementById('restart-btn').addEventListener('click', () => this.restart());
        document.getElementById('undo-btn').addEventListener('click', () => this.undo());
      }
    }

    window.onload = () => new Game2048();
  </script>
</body>
</html>
