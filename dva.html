<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #faf8ef;
      color: #776e65;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      width: 400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
    }

    .scores {
      display: flex;
      gap: 10px;
    }

    .score-box {
      background: #bbada0;
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      text-align: center;
      min-width: 60px;
    }

    .score-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #eee4da;
    }

    .score-value {
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn {
      background: #8f7a66;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #9f8a76;
    }

    /* Fixed Board Dimension - Guaranteed to show up */
    .grid-board {
      width: 400px;
      height: 400px;
      background: #bbada0;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
    }

    .tile {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
    }

    /* Tile Colors */
    .tile-2 { background: #eee4da; color: #776e65; }
    .tile-4 { background: #ede0c8; color: #776e65; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }

    .instructions {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div>Join numbers to reach <strong>2048!</strong></div>
      <div>
        <button class="btn" onclick="game.undo()">Undo</button>
        <button class="btn" onclick="game.restart()">New Game</button>
      </div>
    </div>

    <div class="grid-board" id="board"></div>

    <div class="instructions">
      Use <strong>Arrow keys</strong> or <strong>WASD</strong> to play.
    </div>
  </div>

  <script>
    class Game2048 {
      constructor() {
        this.board = Array(4).fill(null).map(() => Array(4).fill(0));
        this.score = 0;
        this.best = parseInt(localStorage.getItem('2048_best')) || 0;
        this.history = [];
        
        this.boardEl = document.getElementById('board');
        this.scoreEl = document.getElementById('score');
        this.bestEl = document.getElementById('best');
        
        this.initControls();
        this.restart();
      }

      saveState() {
        this.history.push({
          board: JSON.parse(JSON.stringify(this.board)),
          score: this.score
        });
        if (this.history.length > 5) this.history.shift();
      }

      undo() {
        if (this.history.length === 0) return;
        const lastState = this.history.pop();
        this.board = lastState.board;
        this.score = lastState.score;
        this.render();
      }

      restart() {
        this.board = Array(4).fill(null).map(() => Array(4).fill(0));
        this.score = 0;
        this.history = [];
        this.addTile();
        this.addTile();
        this.render();
      }

      addTile() {
        let empty = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (this.board[r][c] === 0) empty.push({ r, c });
          }
        }
        if (empty.length > 0) {
          let { r, c } = empty[Math.floor(Math.random() * empty.length)];
          this.board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
      }

      move(dir) {
        this.saveState();
        let moved = false;
        let scoreGained = 0;

        const rotate = (m) => m[0].map((_, col) => m.map(row => row[col]).reverse());
        
        let rotCount = 0;
        if (dir === 'left') rotCount = 0;
        if (dir === 'down') rotCount = 1;
        if (dir === 'right') rotCount = 2;
        if (dir === 'up') rotCount = 3;

        let temp = JSON.parse(JSON.stringify(this.board));
        for (let i = 0; i < rotCount; i++) temp = rotate(temp);

        for (let r = 0; r < 4; r++) {
          let row = temp[r].filter(v => v !== 0);
          for (let c = 0; c < row.length - 1; c++) {
            if (row[c] === row[c + 1]) {
              row[c] *= 2;
              scoreGained += row[c];
              row.splice(c + 1, 1);
              moved = true;
            }
          }
          while (row.length < 4) row.push(0);
          if (JSON.stringify(temp[r]) !== JSON.stringify(row)) moved = true;
          temp[r] = row;
        }

        for (let i = 0; i < (4 - rotCount) % 4; i++) temp = rotate(temp);

        if (moved) {
          this.board = temp;
          this.score += scoreGained;
          if (this.score > this.best) {
            this.best = this.score;
            localStorage.setItem('2048_best', this.best);
          }
          this.addTile();
          this.render();
        } else {
          this.history.pop();
        }
      }

      render() {
        this.scoreEl.innerText = this.score;
        this.bestEl.innerText = this.best;
        this.boardEl.innerHTML = '';

        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            let val = this.board[r][c];
            let cell = document.createElement('div');
            cell.className = val > 0 ? `tile tile-${val}` : 'tile';
            cell.innerText = val > 0 ? val : '';
            this.boardEl.appendChild(cell);
          }
        }
      }

      initControls() {
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a') this.move('left');
          if (e.key === 'ArrowRight' || e.key === 'd') this.move('right');
          if (e.key === 'ArrowUp' || e.key === 'w') this.move('up');
          if (e.key === 'ArrowDown' || e.key === 's') this.move('down');
        });
      }
    }

    var game;
    window.onload = function() {
      game = new KOSTKA();
    };
  </script>
</body>
</html>
