<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrací kostka</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 280px;
        }

        h1 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Vizuální podoba kostky s CSS transformacemi pro animaci hodu */
        .dice {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border: 3px solid #333;
            border-radius: 16px;
            font-size: 48px;
            font-weight: bold;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            user-select: none;
            transition: transform 0.15s ease-in-out;
        }

        /* Animace otáčení při hodu */
        .rolling {
            animation: roll 0.4s ease-in-out;
        }

        @keyframes roll {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Tlačítko s jemným efekt stisku */
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Historie hodů */
        .history {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hrací kostka</h1>
        
        <div id="dice" class="dice">?</div>
        
        <button id="rollBtn" onclick="hodKostkou()">Hodit kostkou</button>

        <div class="history">
            Poslední hody: <span id="historyList">-</span>
        </div>
    </div>

    <script>
        const posledniHody = [];

        function hodKostkou() {
            const kostkaElement = document.getElementById("dice");
            const btn = document.getElementById("rollBtn");
            const historyElement = document.getElementById("historyList");

            // Dočasně vypne tlačítko během animace
            btn.disabled = true;

            // Přidá CSS třídu pro spuštění animace
            kostkaElement.classList.add("rolling");

            // Rychlé střídání čísel během animace
            let counter = 0;
            const interval = setInterval(() => {
                kostkaElement.textContent = Math.floor(Math.random() * 6) + 1;
                counter++;
                if (counter > 5) {
                    clearInterval(interval);
                }
            }, 60);

            // Vyhodnocení konečného čísla po skončení animace
            setTimeout(() => {
                const konecneCislo = Math.floor(Math.random() * 6) + 1;
                kostkaElement.textContent = konecneCislo;
                kostkaElement.classList.remove("rolling");
                btn.disabled = false;

                // Uložení do historie (maximálně 5 položek)
                posledniHody.unshift(konecneCislo);
                if (posledniHody.length > 5) {
                    posledniHody.pop();
                }
                historyElement.textContent = posledniHody.join(", ");
            }, 400);
        }
    </script>

</body>
</html>
